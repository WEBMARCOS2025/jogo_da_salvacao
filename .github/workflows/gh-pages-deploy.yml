name: Deploy to gh-pages branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          allow_empty_commit: true

      - name: Configure Pages source via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          echo "Configuring Pages source to gh-pages branch..."
          TOKEN="${PAGES_PAT:-$GITHUB_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No token available; skipping Pages API configuration."
            exit 0
          fi
          curl -s -X PUT -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/WEBMARCOS2025/jogo_da_salvacao/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || true
